<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NBA Predictor</title>
<style>
:root{--bg:#0b0f17;--card:#141b29;--card2:#1b2436;--line:#243049;--tx:#e8edf7;--mut:#8b97b0;--ok:#3ddc97;--warn:#ffb84d;--bad:#ff6b6b;--aw:#ff9f43;--hm:#4d7cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:16px 16px 4px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:20px}
.sub{color:var(--mut);font-size:11px}
#trk{display:flex;align-items:center;gap:8px;font-size:12px}
.pillw{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-weight:700}
.dots{display:flex;gap:3px}
.dt{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dt.ok{background:var(--ok)}.dt.no{background:var(--bad)}
.sv{margin:8px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.sv>summary{cursor:pointer;font-size:12px;font-weight:700;display:flex;gap:8px;align-items:center}
.rec{font-size:10px;color:var(--mut);font-weight:700;background:var(--card2);padding:1px 7px;border-radius:99px}
.dy{margin-top:6px}
.dy>summary{cursor:pointer;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding:3px 0;display:flex;gap:8px;align-items:center}
.sr{display:grid;grid-template-columns:44px 1fr auto 22px;gap:8px;font-size:12px;padding:5px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.sr:hover{background:var(--card2)}
.sr .t{color:var(--mut);font-size:10px}
.mu{display:flex;gap:5px;align-items:center;color:var(--mut)}
.mu .pk{color:var(--ok);font-weight:800}
.at2{font-size:10px}
.pc{display:flex;align-items:center;gap:5px}
.pc em{font-style:normal;font-weight:700;font-size:11px;width:22px;text-align:right}
.pc u{display:block;width:44px;height:5px;background:var(--line);border-radius:9px;overflow:hidden;text-decoration:none}
.pc u i{display:block;height:100%;background:var(--ok)}
.rs{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:10px;font-weight:800;background:var(--card2);color:var(--mut)}
.rs.ok{background:#3ddc9730;color:var(--ok)}.rs.no{background:#ff6b6b30;color:var(--bad)}
nav{display:flex;gap:6px;padding:12px 16px 6px;flex-wrap:wrap}
nav button{background:var(--card);color:var(--tx);border:1px solid var(--line);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:12px}
nav button.on{background:#2d5bff;border-color:#2d5bff}
#status{padding:0 16px 8px;color:var(--mut);font-size:11px;min-height:16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px;padding:0 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.card:hover{border-color:#3b5bdb;transform:translateY(-2px)}
.card.isLive{border-color:#ff6b6b88}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:11px;margin-bottom:8px;gap:8px}
.teams{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tm{flex:1;text-align:center;border-radius:10px;padding:2px}
.tm:hover{background:var(--card2)}
.tm img{display:block;width:44px;height:44px;object-fit:contain;margin:0 auto 2px}
.tm b{display:block;font-size:15px}
.tm small{color:var(--mut);font-size:11px}
.side{display:block;width:max-content;margin:0 auto 5px;font-size:9px;letter-spacing:.1em;color:var(--mut);background:var(--card2);padding:1px 7px;border-radius:99px;font-weight:700;line-height:1.5}
.side.home{background:#2d5bff33;color:#9db4ff}
.side.inl{display:inline-block;margin:0 3px;vertical-align:middle}
.sc{font-size:26px;font-weight:800;line-height:1.1}
.sc.lead{color:var(--ok)}
.at{color:var(--mut);font-size:12px;margin-top:46px}
.live{color:var(--bad);font-weight:700;display:inline-flex;align-items:center;gap:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.livebox{margin:6px 0;padding:8px 12px;border-radius:10px;background:#ff6b6b18;border:1px solid #ff6b6b55;font-size:14px}
.finbox{margin:6px 0;padding:8px 12px;border-radius:10px;background:var(--card2);font-size:14px}
.pbar{display:flex;height:10px;border-radius:99px;overflow:hidden;margin:10px 0 4px;background:var(--line)}
.pbar i{display:block;height:100%}
.pl{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tile{background:var(--card2);border-radius:10px;padding:6px 8px;text-align:center}
.tile small{display:block;color:var(--mut);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.tile b{font-size:14px}
.tile.g b{color:var(--ok)}
.fcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.fc{font-size:10px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:1px 7px;color:var(--mut)}
.fc b{color:var(--tx)}
.final{color:var(--warn);font-weight:700}
.bd{font-size:10px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut);font-weight:700;display:inline-block}
.bd.lk{color:#9db4ff;border-color:#2d5bff55}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px 8px;z-index:9}
#modal.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(860px,100%);padding:16px;position:relative}
.x{position:absolute;right:12px;top:8px;background:none;border:0;color:var(--tx);font-size:24px;cursor:pointer}
.back{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;margin-bottom:8px}
.tbtn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:5px 11px;cursor:pointer;font-weight:700;margin:0 6px 6px 0;font-size:12px}
.tbtn:hover{border-color:#3b5bdb}
h2{font-size:11px;margin:18px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
h2 .lg{float:right;text-transform:none;letter-spacing:0;font-weight:600}
table{width:100%;border-collapse:collapse}
td,th{padding:4px 3px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle;text-align:left}
th{color:var(--mut);font-weight:600;font-size:10px}
.pos{display:inline-block;min-width:24px;color:var(--mut);font-size:10px}
.num td,.num th{text-align:right}.num td:first-child,.num th:first-child{text-align:left}
tr.tot td{font-weight:800;color:var(--ok)}
.cmp{display:grid;grid-template-columns:44px 1fr 74px 1fr 44px;gap:5px;align-items:center;padding:3px 0;font-size:12px}
.cmp .l{text-align:center;color:var(--mut);font-size:10px}
.cmp .bar{height:7px;background:var(--line);border-radius:9px;display:flex}
.cmp .bar.a{justify-content:flex-end}
.cmp .bar i{display:block;height:100%;border-radius:9px;background:#5b6b8c}
.cmp .bar i.w{background:var(--ok)}
.cmp .v{font-weight:600}.cmp .v.r{text-align:right}
.w-txt{color:var(--ok)}
.tly{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:6px;font-size:12px}
.dv{display:grid;grid-template-columns:84px 1fr 38px;gap:6px;align-items:center;padding:3px 0;font-size:12px}
.dv .dl{color:var(--mut);font-size:11px}
.dv .dn{text-align:right;font-weight:700;font-size:11px}
.dvb{display:grid;grid-template-columns:1fr 1fr;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.dvb .l{display:flex;justify-content:flex-end;border-right:1px solid var(--bg)}
.dvb .l i{display:block;height:100%;background:var(--aw)}
.dvb .r i{display:block;height:100%;background:var(--hm)}
.ij{display:inline-block;font-size:10px;font-weight:700;border-radius:6px;padding:2px 7px;margin:2px 3px 2px 0;background:var(--card2);color:var(--mut);white-space:nowrap}
.ij.out{background:#ff6b6b25;color:var(--bad)}.ij.dbt{background:#ffb84d25;color:var(--warn)}.ij.q{background:#ffb84d15;color:var(--warn)}.ij.ad{background:#3ddc9725;color:var(--ok)}
.sw{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:2px 0 6px}
.sw .ij{margin:0}
.sw .ar{color:var(--mut);font-size:12px}
.q{color:var(--warn);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.st{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.st .tile b{font-size:13px}
.th{margin-bottom:3px;font-size:13px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}
.chip.W{background:#3ddc9730;color:var(--ok)}.chip.L{background:#ff6b6b30;color:var(--bad)}
.ir{border-top:1px solid var(--line);padding:4px 0}
.ir:first-of-type{border-top:0}
.ir summary{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;list-style:none;flex-wrap:wrap}
.ir summary::-webkit-details-marker{display:none}
.ib{font-size:9px;font-weight:800;border-radius:5px;padding:2px 6px;min-width:34px;text-align:center;background:var(--card2);color:var(--mut)}
.ib.out{background:#ff6b6b25;color:var(--bad)}
.ib.dbt{background:#ffb84d25;color:var(--warn)}
.ib.dtd,.ib.q{background:#ffb84d15;color:var(--warn)}
.ig{font-size:10px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:0 7px;color:var(--tx);text-transform:capitalize}
.is{font-size:10px;color:var(--mut);margin-left:auto}
.is:before{content:"📰 "}
.inf{font-size:11px;color:var(--mut);padding:4px 0 2px 40px;line-height:1.35}
.ret{font-size:10px;color:var(--ok)}
@media(max-width:560px){.two{grid-template-columns:1fr}.st{grid-template-columns:repeat(3,1fr)}}
footer{padding:0 16px 24px;color:var(--mut);font-size:10px}
</style>
</head>
<body>
<header>
  <div><h1>🏀 NBA Predictor</h1><div class="sub">Oras: Manila</div></div>
  <div id="trk"></div>
</header>
<details class="sv" id="saved"><summary id="savedSum">📌 Saved</summary><div id="savedBody"></div></details>
<nav id="tabs"></nav>
<div id="status"></div>
<main id="grid"></main>
<footer>Para sa libangan lang, hindi garantiya. Data: ESPN. Naka-save sa browser mo ang picks at tracker.</footer>
<div id="modal"><div class="sheet"><button class="x" onclick="closeModal()">×</button><div id="mbody"></div></div></div>

<script>
const API='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const API2='https://site.api.espn.com/apis/v2/sports/basketball/nba';
const SEASON_START='2026-10-15';
const PRIOR_SEASON=2026;
const HCA=2.5;
const REFRESH_MS=20000;
const SAMPLE=15;
const RECENT=5;
const KEEP_DAYS=3;
const LG={tp:0.36,orb:0.27,tov:0.135};
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dayIn=(d,tz)=>new Intl.DateTimeFormat('en-CA',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const fmtET=d=>dayIn(d,'America/New_York');
const fmtMN=d=>dayIn(d,'Asia/Manila');
const ymd=s=>s.replace(/-/g,'');
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const getJSON=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status+' '+u);return r.json()};
const f1=x=>(x>=0?'+':'')+x.toFixed(1);

let SCHED={}, M={}, INJ={}, PL={}, PL_N={}, PRIOR={}, CUR=0, DAYS=[], STATUS_BASE='', LASTUP='', LASTSIG='', TICK=0;
let PL_DONE={};
const OPEN={};
const allEvents=()=>{const m=new Map();for(const d in SCHED)for(const e of SCHED[d])m.set(e.id,e);return [...m.values()]};
const evsOn=day=>allEvents().filter(e=>e.mnDay===day).sort((a,b)=>a.date.localeCompare(b.date));
const findEv=id=>allEvents().find(e=>e.id===id);

const LOC={ATL:[33.757,-84.396,-5],BOS:[42.366,-71.062,-5],BKN:[40.683,-73.975,-5],CHA:[35.225,-80.839,-5],CHI:[41.881,-87.674,-6],
CLE:[41.496,-81.688,-5],DAL:[32.790,-96.810,-6],DEN:[39.749,-105.008,-7],DET:[42.341,-83.055,-5],GS:[37.768,-122.388,-8],
HOU:[29.751,-95.362,-6],IND:[39.764,-86.156,-5],LAC:[33.943,-118.341,-8],LAL:[34.043,-118.267,-8],MEM:[35.138,-90.051,-6],
MIA:[25.781,-80.187,-5],MIL:[43.045,-87.917,-6],MIN:[44.980,-93.276,-6],NO:[29.949,-90.082,-6],NY:[40.751,-73.994,-5],
OKC:[35.463,-97.515,-6],ORL:[28.539,-81.384,-5],PHI:[39.901,-75.172,-5],PHX:[33.446,-112.071,-7],POR:[45.532,-122.667,-8],
SAC:[38.580,-121.500,-8],SA:[29.427,-98.438,-6],TOR:[43.643,-79.379,-5],UTA:[40.768,-111.901,-7],UTAH:[40.768,-111.901,-7],WSH:[38.898,-77.021,-5],WAS:[38.898,-77.021,-5]};
function miles(a,b){const R=3959,r=x=>x*Math.PI/180;const dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);
  const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}

/* ---------- saved predictions + tracker ---------- */
const DB_KEY='nbaSaved_v2';
let DB={snaps:{},arch:{w:0,l:0,r:[]}};
try{const x=JSON.parse(localStorage.getItem(DB_KEY)||'null');if(x&&x.snaps)DB={snaps:x.snaps,arch:x.arch||{w:0,l:0,r:[]}}}catch(e){}
const TK=DB.snaps;
const saveDB=()=>{try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}catch(e){}};

const LABELS={rating:'Rating',home:'Home court',rest:'Back-to-back',sched:'Travel',form:'Form (L10)',
  h2h:'Head-to-head',inj:'Injuries',ret:'Returning',eff:'Efficiency',style:'Style',split:'Home/road'};
const SH={rating:'Rating',home:'Home',rest:'B2B',sched:'Travel',form:'Form',h2h:'H2H',inj:'Injury',ret:'Return',eff:'Eff',style:'Style',split:'Split'};

const mkSnap=(e,p,locked,recon)=>({
  pred:{p:p.p,spread:p.spread,F:p.F,sH:p.sH,sA:p.sA,tot:p.tot,reasons:p.reasons,sd:p.sd,fH:p.fH,fA:p.fA,rtH:p.rtH,rtA:p.rtA,iH:p.iH,iA:p.iA},
  h:e.home.abbr,a:e.away.abbr,d:e.date,mn:e.mnDay,locked,recon});

function reconstruct(ev){
  const gm=allEvents().filter(e=>e.completed&&e.type!==1&&e.id!==ev.id&&e.date<ev.date);
  const sM=M,sP=PL_DONE,sI=INJ;
  try{M=buildModel(gm);PL_DONE={};INJ={};return predict(ev)}
  catch(e){return null}
  finally{M=sM;PL_DONE=sP;INJ=sI}
}
function getPred(ev){
  if(ev.state==='pre')return predict(ev);
  const s=TK[ev.id];
  return s?{...s.pred,labels:LABELS}:null;
}
function recordAll(){
  let ch=false;
  const today=fmtMN(new Date()),cut=addDays(today,-KEEP_DAYS);
  for(const e of allEvents()){
    if(e.type===1||e.mnDay<cut)continue;
    const old=TK[e.id];
    if(e.state==='pre'){
      if(old&&old.locked)continue;
      if(!PL_DONE[e.home.id]||!PL_DONE[e.away.id])continue;
      const p=predict(e);if(!p)continue;
      if(!old||Math.abs(old.pred.p-p.p)>0.0005||Math.abs(old.pred.spread-p.spread)>0.05){TK[e.id]=mkSnap(e,p,false,false);ch=true}
    }else{
      if(old){if(!old.locked){old.locked=true;ch=true}}
      else{const p=reconstruct(e);if(p){TK[e.id]=mkSnap(e,p,true,true);ch=true}}
    }
    const s=TK[e.id];
    if(s&&e.completed&&!s.fin){s.fin=1;s.as=e.away.score;s.hs=e.home.score;ch=true}
  }
  for(const id in TK){
    const s=TK[id];
    if(s.mn<cut){
      if(s.fin){const ok=(s.pred.p>=.5)===(s.hs>s.as);ok?DB.arch.w++:DB.arch.l++;DB.arch.r.push(ok?1:0);DB.arch.r=DB.arch.r.slice(-10)}
      delete TK[id];ch=true;
    }
  }
  if(ch)saveDB();
}
function trackStats(){
  let w=DB.arch.w,l=DB.arch.l;const rec=[];
  for(const id in TK){
    const s=TK[id];if(!s.fin)continue;
    const ok=(s.pred.p>=.5)===(s.hs>s.as);
    ok?w++:l++;rec.push({d:s.d,ok:ok?1:0});
  }
  rec.sort((a,b)=>a.d.localeCompare(b.d));
  const seq=[...DB.arch.r,...rec.map(x=>x.ok)].slice(-10);
  return {w,l,n:w+l,seq};
}
function renderTracker(){
  const s=trackStats();
  $('#trk').innerHTML=s.n?`<span class="pillw">🎯 ${s.w}-${s.l} · ${Math.round(s.w/s.n*100)}%</span><span class="dots">${s.seq.map(x=>`<i class="dt ${x?'ok':'no'}"></i>`).join('')}</span>`
    :'<span class="pillw">🎯 0-0</span>';
}
function togDay(d,o){OPEN[d]=o}
function renderSaved(){
  const today=fmtMN(new Date()),cut=addDays(today,-KEEP_DAYS);
  const by={};let n=0,tw=0,tl=0;
  for(const id in TK){const s=TK[id];if(s.mn<cut)continue;(by[s.mn]??=[]).push([id,s]);n++}
  const days=Object.keys(by).sort().reverse();
  const lab=d=>{const k=Math.round((Date.parse(d)-Date.parse(today))/864e5);
    const nm=k===0?'Ngayon':k===1?'Bukas':k===-1?'Kahapon':'';
    const dt=new Date(d+'T12:00:00Z').toLocaleDateString('en-PH',{timeZone:'UTC',month:'short',day:'numeric'});
    return (nm?nm+' · ':'')+dt};
  let html='';
  for(const d of days){
    let w=0,l=0;
    const rows=by[d].sort((a,b)=>a[1].d.localeCompare(b[1].d)).map(([id,s])=>{
      const pr=s.pred,hp=pr.p>=.5,pc=Math.round((hp?pr.p:1-pr.p)*100);
      const ev=findEv(id);
      let res='<span class="rs">·</span>';
      if(s.fin){const ok=(pr.p>=.5)===(s.hs>s.as);ok?w++:l++;res=`<span class="rs ${ok?'ok':'no'}" title="${s.as}-${s.hs}">${ok?'✓':'✗'}</span>`}
      else if(ev&&ev.state==='in')res='<span class="dot"></span>';
      const tm=new Date(s.d).toLocaleTimeString('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit'}).replace(' ','');
      return `<div class="sr" onclick="openDetail('${id}')" title="Predicted ${Math.round(pr.sA)}-${Math.round(pr.sH)}${s.recon?' · rekonstruksyon':''}">
        <span class="t">${tm}</span>
        <span class="mu"><span class="${!hp?'pk':''}">${s.a}</span><span class="at2">@</span><span class="${hp?'pk':''}">${s.h}</span>${s.recon?'<span class="at2" title="rekonstruksyon">ᴿ</span>':''}</span>
        <span class="pc"><em>${pc}</em><u><i style="width:${pc}%"></i></u></span>${res}</div>`;
    }).join('');
    tw+=w;tl+=l;
    const open=OPEN[d]!==undefined?OPEN[d]:d>=today;
    html+=`<details class="dy" ${open?'open':''} ontoggle="togDay('${d}',this.open)"><summary>${lab(d)}${w+l?`<span class="rec">${w}-${l}</span>`:''}</summary>${rows}</details>`;
  }
  $('#savedSum').innerHTML=`📌 Saved <span class="rec">${n}</span>${tw+tl?`<span class="rec">${tw}-${tl}</span>`:''}`;
  $('#savedBody').innerHTML=html||'<div class="sub">Wala pa.</div>';
}

/* ---------- parsing ---------- */
const tm=x=>({id:String(x.team.id),abbr:x.team.abbreviation,name:x.team.displayName,logo:x.team.logo,
  color:x.team.color?'#'+x.team.color:'#888',score:+x.score||0,record:x.records?.[0]?.summary||''});
function parseEvent(e){
  const c=e.competitions[0];
  const h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');
  const st=c.status||e.status;
  const dt=new Date(e.date);

/* ---------- ratings ---------- */
function buildModel(games){
  const T={};
  const get=t=>T[t.id]??={id:t.id,abbr:t.abbr,name:t.name,logo:t.logo,color:t.color,g:[],prior:PRIOR[t.id]??0};
  games=[...games].sort((a,b)=>a.date.localeCompare(b.date));
  for(const g of games){
    const H=get(g.home),A=get(g.away),m=g.home.score-g.away.score;
    H.g.push({id:g.id,day:g.etDay,opp:A.id,home:true,pf:g.home.score,pa:g.away.score,m});
    A.g.push({id:g.id,day:g.etDay,opp:H.id,home:false,pf:g.away.score,pa:g.home.score,m:-m});
  }
  const ids=Object.keys(T);
  let r={};ids.forEach(i=>r[i]=0);
  for(let it=0;it<30;it++){
    const nr={};
    for(const i of ids){const t=T[i];
      nr[i]=t.g.length?t.g.reduce((s,x)=>s+(x.m-(x.home?HCA:-HCA))+(r[x.opp]||0),0)/t.g.length:0;}
    r=nr;
  }
  const elo={};ids.forEach(i=>elo[i]=1500+T[i].prior*25);
  for(const g of games){
    const h=g.home.id,a=g.away.id,m=g.home.score-g.away.score;
    const dH=elo[h]+HCA*25-elo[a],p=1/(1+Math.pow(10,-dH/400));
    const mult=Math.pow(Math.abs(m)+3,0.8)/(7.5+0.006*Math.abs(dH));
    const d=20*mult*((m>0?1:0)-p);elo[h]+=d;elo[a]-=d;
  }
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
  for(const i of ids){
    const t=T[i],n=t.g.length,w=n/(n+10);
    t.n=n;t.srs=r[i];t.elo=elo[i];t.eloPts=(elo[i]-1500)/25;
    t.str=0.5*(w*r[i]+(1-w)*t.prior)+0.5*t.eloPts;
    t.pf=n?t.g.reduce((s,x)=>s+x.pf,0)/n:112;
    t.pa=n?t.g.reduce((s,x)=>s+x.pa,0)/n:112;
    t.net=t.pf-t.pa;
    const l10=t.g.slice(-10);
    t.l10=l10.length?l10.reduce((s,x)=>s+x.m,0)/l10.length:0;
    t.w=t.g.filter(x=>x.m>0).length;t.l=n-t.w;
    const HG=t.g.filter(x=>x.home),RG=t.g.filter(x=>!x.home);
    t.hn=HG.length;t.rn=RG.length;
    t.hm=avg(HG.map(x=>x.m));t.rm=avg(RG.map(x=>x.m));t.mavg=avg(t.g.map(x=>x.m));
    t.hw=HG.filter(x=>x.m>0).length;t.rw=RG.filter(x=>x.m>0).length;
    t.sos=avg(t.g.map(x=>r[x.opp]||0));
    const cg=t.g.filter(x=>Math.abs(x.m)<=5);
    t.cw=cg.filter(x=>x.m>0).length;t.cl=cg.length-t.cw;
  }
  return T;
}
function rebuildModel(){
  const seen=new Map();
  for(const e of allEvents())if(e.completed&&e.type!==1)seen.set(e.id,e);
  M=buildModel([...seen.values()]);
  return seen.size;
}

const POSORD={PG:1,G:1.5,SG:2,SF:3,F:3.5,PF:4,C:5};
function parseSummary(s){
  const pls=s?.boxscore?.players;if(!pls?.length)return null;
  const out={t:{},p:{}};
  for(const tb of pls){
    const tid=String(tb.team.id),list=[];
    const T={pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,orb:0,drb:0,reb:0,ast:0,stl:0,blk:0,to:0};
    for(const st of tb.statistics||[]){
      const L=st.labels||[];
      for(const a of st.athletes||[]){
        if(a.didNotPlay||!a.stats?.length)continue;
        const g=k=>a.stats[L.indexOf(k)];
        const n=k=>parseFloat(g(k))||0;
        const pr=k=>String(g(k)||'0-0').split('-').map(x=>parseFloat(x)||0);
        const min=n('MIN');if(min<=0)continue;
        const [fgm,fga]=pr('FG'),[tpm,tpa]=pr('3PT'),[ftm,fta]=pr('FT');
        const o={id:String(a.athlete.id),name:a.athlete.displayName,pos:a.athlete.position?.abbreviation||'',st:a.starter?1:0,
          min,pts:n('PTS'),reb:n('REB'),ast:n('AST'),stl:n('STL'),blk:n('BLK'),to:n('TO'),fgm,fga,tpm,tpa};
        list.push(o);
        T.pts+=o.pts;T.fgm+=fgm;T.fga+=fga;T.tpm+=tpm;T.tpa+=tpa;T.ftm+=ftm;T.fta+=fta;
        T.orb+=n('OREB');T.drb+=n('DREB');T.reb+=o.reb;T.ast+=o.ast;T.stl+=o.stl;T.blk+=o.blk;T.to+=o.to;
      }
    }
    if(T.orb+T.drb===0){T.orb=T.reb*LG.orb;T.drb=T.reb-T.orb}
    out.t[tid]=T;out.p[tid]=list;
  }
  return Object.keys(out.t).length===2?out:null;
}

/* ---------- players + team advanced ---------- */
const z=()=>({gp:0,st:0,min:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0,fgm:0,fga:0,tpm:0,tpa:0});
const addP=(X,p)=>{X.gp++;X.st+=p.st;X.min+=p.min;X.pts+=p.pts;X.reb+=p.reb;X.ast+=p.ast;X.stl+=p.stl;X.blk+=p.blk;X.to+=p.to;X.fgm+=p.fgm;X.fga+=p.fga;X.tpm+=p.tpm;X.tpa+=p.tpa};
const dv=(a,b)=>b?a/b:0;
const ensure=id=>(PL[id]??=loadTeam(id).then(r=>{PL_N[id]=M[id]?.n;return r})
  .catch(()=>({players:[],team:null,sample:0,depth:0})));
async function loadTeam(id){
  const gl=(M[id]?.g||[]).slice(-SAMPLE);
  const n=gl.length;
  const sums=await Promise.all(gl.map(g=>getSummary(g.id)));
  const pl={};
  const zt=()=>({pts:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,orb:0,drb:0,reb:0,ast:0,stl:0,blk:0,to:0});
  const S={g:0,poss:0,m:zt(),o:zt()};
  sums.forEach((s,i)=>{

    const m=s.t[id],o=s.t[oid];if(!o)return;

    const pm=m.fga+0.44*m.fta-m.orb+m.to,po=o.fga+0.44*o.fta-o.orb+o.to;

      addP(q.A,p);if(rec)addP(q.R,p);

    }
  });
  const players=Object.values(pl).map(q=>{
    const A=q.A,R=q.R;
    const bl=k=>{const a=A[k]/A.gp;return R.gp?0.6*a+0.4*R[k]/R.gp:a};
    const o={id:q.id,name:q.name,pos:q.pos,gp:A.gp,starts:A.st,
      mpg:bl('min'),ppg:bl('pts'),rpg:bl('reb'),apg:bl('ast'),spg:bl('stl'),bpg:bl('blk'),topg:bl('to'),
      fgmg:bl('fgm'),fgag:bl('fga'),tpmg:bl('tpm'),tpag:bl('tpa'),missed:n-1-q.last};
    o.fgp=o.fgag?o.fgmg/o.fgag*100:0;o.tpp=o.tpag?o.tpmg/o.tpag*100:0;
    o.rank=R.st*3+A.st+o.mpg/100;
    return o;
  });
  let team=null;const g=S.g;
  if(g){
    const m=S.m,o=S.o,P=S.poss;
    team={gp:g,pace:P/g,ortg:dv(m.pts,P)*100,drtg:dv(o.pts,P)*100,
      off:{efg:dv(m.fgm+.5*m.tpm,m.fga)*100,tov:dv(m.to,m.fga+.44*m.fta+m.to)*100,orb:dv(m.orb,m.orb+o.drb)*100,ftr:dv(m.ftm,m.fga)*100},
      def:{efg:dv(o.fgm+.5*o.tpm,o.fga)*100,tov:dv(o.to,o.fga+.44*o.fta+o.to)*100,drb:dv(m.drb,m.drb+o.orb)*100,ftr:dv(o.ftm,o.fga)*100},
      fgp:dv(m.fgm,m.fga)*100,tpp:dv(m.tpm,m.tpa)*100,oppTpp:dv(o.tpm,o.tpa)*100,tpa:m.tpa/g,missPG:(m.fga-m.fgm)/g,
      reb:m.reb/g,ast:m.ast/g,to:m.to/g,stl:m.stl/g,blk:m.blk/g};
    team.net=team.ortg-team.drtg;

/* ---------- injuries + lineup ---------- */
const SEV=s=>{s=(s||'').toLowerCase();if(s.includes('out'))return 1;if(s.includes('doubt'))return .8;
  if(s.includes('quest')||s.includes('day'))return .35;return 0};
const injOf=t=>INJ[t.id]||INJ[t.name]||[];
const impactOf=p=>Math.min(7,Math.max(0,(p.ppg+0.7*p.apg+0.7*p.rpg-8)*0.22));
function injImpact(team){
  const list=injOf(team);const data=PL_DONE[team.id];let pts=0;const names=[];
  const dm=data&&data.depth?clamp(1+(9-data.depth)*0.05,0.85,1.3):1;
  for(const i of list){
    const sv=SEV(i.status);if(!sv)continue;
    const p=data?.players.find(x=>x.id===i.id||x.name===i.name);
    if(p){const v=impactOf(p)*sv*dm;pts+=v;if(v>0.5)names.push(`${i.name} (${i.status})`)}
  }
  return {pts,names};
}
function returning(team){
  const d=PL_DONE[team.id];if(!d)return {pts:0,names:[]};
  const inj=injOf(team);let pts=0;const names=[];
  for(const p of d.players){
    if(p.missed<2||p.missed>10||p.gp<3||p.mpg<18)continue;
    if(inj.some(i=>(i.id===p.id||i.name===p.name)&&SEV(i.status)>0))continue;
    const pen=Math.min(1,impactOf(p)*0.15);
    if(pen>=0.15){pts+=pen;names.push(`${p.name} (di nakalaro ng ${p.missed} laro)`)}
  }
  return {pts,names};
}
function lineup(id){
  const d=PL_DONE[id],t=M[id];if(!d||!t)return null;
  const list=injOf(t);
  const outL=list.filter(i=>SEV(i.status)>=.8),qL=list.filter(i=>SEV(i.status)>0&&SEV(i.status)<.8);
  const isOut=p=>outL.some(i=>i.id===p.id||i.name===p.name);
  const isQ=p=>qL.some(i=>i.id===p.id||i.name===p.name);
  const rank=[...d.players].sort((a,b)=>b.rank-a.rank);
  const orig=rank.slice(0,5);
  const avail=rank.filter(p=>!isOut(p));
  const stArr=avail.slice(0,5);
  const stIds=new Set(stArr.map(p=>p.id));
  const starters=[...stArr].sort((a,b)=>(POSORD[a.pos]||9)-(POSORD[b.pos]||9));
  const removed=orig.filter(isOut);
  const added=stArr.filter(p=>!orig.some(o=>o.id===p.id));
  const bench=avail.filter(p=>!stIds.has(p.id)).sort((a,b)=>b.mpg-a.mpg);
  const agg=arr=>{
    const s=f=>arr.reduce((x,p)=>x+p[f],0);
    return {pts:s('ppg'),reb:s('rpg'),ast:s('apg'),min:s('mpg'),
      fgp:s('fgag')?s('fgmg')/s('fgag')*100:0,tpp:s('tpag')?s('tpmg')/s('tpag')*100:0};
  };
  const S=agg(starters),B=agg(bench);
  return {starters,bench,removed,added,isQ,outL,S,B,benchShare:(S.pts+B.pts)?B.pts/(S.pts+B.pts)*100:0,sample:d.sample,depth:d.depth};
}

/* ---------- schedule / fatigue ---------- */
function fatigue(id,ev){
  const prevs=allEvents().filter(e=>e.type!==1&&e.id!==ev.id&&e.date<ev.date&&(e.home.id===id||e.away.id===id))
    .sort((a,b)=>a.date.localeCompare(b.date));
  const out={pts:0,tags:[],rest:null,b2b:false,trip:0,mi:0,tz:0,n4:1};
  const last=prevs[prevs.length-1];
  if(!last)return out;
  const dd=e=>Math.round((Date.parse(ev.etDay)-Date.parse(e.etDay))/864e5);
  out.rest=Math.max(0,dd(last)-1);out.b2b=dd(last)===1;
  out.n4=prevs.filter(e=>dd(e)<=3).length+1;
  const n6=prevs.filter(e=>dd(e)<=5).length+1;
  let trip=0;
  if(ev.away.id===id){trip=1;for(let i=prevs.length-1;i>=0&&prevs[i].away.id===id;i--)trip++}
  out.trip=trip;
  const a=LOC[last.home.abbr],b=LOC[ev.home.abbr];
  if(a&&b){out.mi=miles(a,b);out.tz=b[2]-a[2]}
  if(out.b2b)out.tags.push('back-to-back');
  if(out.n4>=3){out.pts+=1;out.tags.push('3 laro sa 4 gabi')}
  else if(n6>=4){out.pts+=.6;out.tags.push('4 laro sa 6 gabi')}
  if(out.b2b&&out.mi>600){out.pts+=.5;out.tags.push(`${Math.round(out.mi)} mi biyahe sa back-to-back`)}
  else if(out.mi>1500&&out.rest<=1){out.pts+=.4;out.tags.push(`${Math.round(out.mi)} mi biyahe`)}
  if(trip>=4){out.pts+=Math.min(1.5,.35*(trip-3));out.tags.push(`road game #${trip} sa trip`)}
  if(Math.abs(out.tz)>=2&&out.rest<=1){out.pts+=out.tz>0?.5:.3;out.tags.push(`timezone ${out.tz>0?'+':''}${out.tz}h`)}
  return out;
}

/* ---------- style ---------- */
function styleEdge(X,Y,k){
  const c=v=>clamp(v,-1.5,1.5);
  const t3=c(X.tpa*(Y.oppTpp-LG.tp*100)/100*3*0.5*k);
  const rb=c(X.missPG*((100-Y.def.drb)-LG.orb*100)/100*1.1*0.5*k);
  const tv=c(-(Y.def.tov-LG.tov*100)/100*X.pace*0.9*0.5*k);
  return {t3,rb,tv};
}

/* ---------- prediction ---------- */
function predict(ev){
  const H=M[ev.home.id],A=M[ev.away.id];
  if(!H||!A)return null;
  const fH=fatigue(H.id,ev),fA=fatigue(A.id,ev);
  const iH=injImpact(H),iA=injImpact(A);
  const rtH=returning(H),rtA=returning(A);
  const tH=PL_DONE[H.id]?.team,tA=PL_DONE[A.id]?.team;
  const h2hG=H.g.filter(x=>x.opp===A.id);
  const h2h=h2hG.length?h2hG.reduce((s,x)=>s+(x.home?x.m-HCA:x.m+HCA),0)/h2hG.length*0.1:0;
  let eff=0,style=0,sd={t3:0,rb:0,tv:0};
  if(tH&&tA){
    const k=Math.min(tH.gp,tA.gp);
    eff=clamp(0.25*(tH.net-tA.net)*k/(k+12),-3,3);
    const ks=k/(k+10);
    const eH=styleEdge(tH,tA,ks),eA=styleEdge(tA,tH,ks);
    sd={t3:eH.t3-eA.t3,rb:eH.rb-eA.rb,tv:eH.tv-eA.tv};
    style=clamp(sd.t3+sd.rb+sd.tv,-3,3);
  }
  const kH=H.hn/(H.hn+15),kA=A.rn/(A.rn+15);
  const split=clamp(0.5*((H.hm-H.mavg)*kH-(A.rm-A.mavg)*kA),-2,2);
  const F={
    rating:H.str-A.str,
    home:HCA,
    rest:(fA.b2b?2:0)-(fH.b2b?2:0),
    sched:fA.pts-fH.pts,
    form:0.12*(H.l10-A.l10),
    h2h,
    inj:iA.pts-iH.pts,
    ret:rtA.pts-rtH.pts,
    eff,style,split
  };
  const spread=Object.values(F).reduce((a,b)=>a+b,0);
  const p=1/(1+Math.exp(-spread*0.145));
  let tot=(H.n&&A.n)?(H.pf+A.pa)/2+(A.pf+H.pa)/2:224;
  if(tH&&tA){const pc=(tH.pace+tA.pace)/2;const t2=pc/100*((tH.ortg+tA.drtg)/2+(tA.ortg+tH.drtg)/2);tot=(tot+t2)/2}
  return {p,spread,F,labels:LABELS,reasons:[],sH:(tot+spread)/2,sA:(tot-spread)/2,tot,fH,fA,iH,iA,rtH,rtA,sd,tH,tA};
}

/* ---------- injury display ---------- */
function injInfo(i){
  const t=((i.note||'')+' '+(i.long||'')).replace(/\s+/g,' ').trim(),low=t.toLowerCase();
  let why=(i.part||'').trim();

    ['illness','Illness'],['conditioning','Conditioning'],['not ready','Not ready'],['rehab','Rehab'],['rest','Rest']];
    for(const [k,v] of kw)if(low.includes(k)){why=v;break}}

  if(m){who=m[1];src=m[2]}
  else if((m=t.match(/per ([A-Z][\w.'-]+(?: [A-Z][\w.'-]+){1,2}) of (The [A-Z]\w+|[A-Za-z0-9]+(?:\.[a-z]+)?)/))){who=m[1];src=m[2]}
  else if((m=t.match(/([A-Z][a-z]+ [A-Z][a-z]+) reports/))){who=m[1]}
  src=src.replace(/\.com$/i,'');

  const code=s.includes('out')?'out':s.includes('doubt')?'dbt':s.includes('day')?'dtd':'q';
  const short={out:'OUT',dbt:'DBT',dtd:'DTD',q:'Q'}[code];
  const tag=src?(who?`${src} · ${sh(who)}`:src):(who?sh(who):'ESPN');
  return {code,short,why,tag,text:(i.note||i.long||'').slice(0,230)};
}
function injChips(t){
  const d=PL_DONE[t.id];
  const l=injOf(t).filter(i=>SEV(i.status)>0).map(i=>({...i,sv:SEV(i.status),ppg:(d?.players.find(x=>x.id===i.id||x.name===i.name)?.ppg)??-1}))
    .sort((a,b)=>b.sv-a.sv||b.ppg-a.ppg);
  if(!l.length)return '<span class="sub">Walang injury</span>';
  const row=i=>{const f=injInfo(i);
    const ret=i.ret?`<span class="ret">↩ ${String(i.ret).slice(0,10)}</span>`:'';
    return `<details class="ir"><summary><span class="ib ${f.code}">${f.short}</span><b>${sh(i.name)}</b>${f.why?`<span class="ig">${f.why}</span>`:''}${ret}<span class="is">${f.tag}</span></summary>${f.text?`<div class="inf">${f.text}</div>`:''}</details>`};
  return l.slice(0,10).map(row).join('')+(l.length>10?`<div class="sub">+${l.length-10} pa</div>`:'');
}

/* huling 10: W/L chips na may score */
const chipsRow=t=>`<div class="chips">${t.g.slice(-10).map(x=>`<span class="chip ${x.m>0?'W':'L'}">${x.m>0?'W':'L'} ${x.pf}-${x.pa}</span>`).join('')||'—'}</div>`;

/* substitution sa starting 5: Out → Pumalit */
function swapHTML(L){
  const r=L.removed,a=L.added;
  if(!r.length&&!a.length)return '';
  const n=Math.max(r.length,a.length);let h='';
  for(let i=0;i<n;i++){
    h+=`<div class="sw">${r[i]?`<span class="ij out">✕ ${sh(r[i].name)}</span>`:''}${r[i]&&a[i]?'<span class="ar">→</span>':''}${a[i]?`<span class="ij ad">↑ ${sh(a[i].name)}</span>`:''}</div>`;
  }
  return h;
}

function tally(aw,hw,a,h){
  const t=(aw+hw)||1;
  return `<div class="tly"><b>${a.abbr} ${aw}</b><div class="pbar" style="height:6px;margin:0"><i style="width:${aw/t*100}%;background:var(--aw)"></i><i style="width:${hw/t*100}%;background:var(--hm)"></i></div><b>${hw} ${h.abbr}</b></div>`;
}
function cmpHTML(rows){
  let aw=0,hw=0;
  const html=rows.map(([l,av,hv,hi,dec])=>{
    dec=dec??1;
    const better=hi===-1?'':hi?(av>hv?'a':av<hv?'h':''):(av<hv?'a':av>hv?'h':'');
    if(better==='a')aw++;if(better==='h')hw++;
    const up=hi!==0;
    let sa=up?av:1/Math.max(av,.1),sh2=up?hv:1/Math.max(hv,.1);
    if(up&&(av<0||hv<0)){sa=av+50;sh2=hv+50}
    const tt=(sa+sh2)||1,wa=sa/tt*100,wh=sh2/tt*100;
    return `<div class="cmp"><span class="v ${better==='a'?'w-txt':''}">${av.toFixed(dec)}</span>
      <div class="bar a"><i class="${better==='a'?'w':''}" style="width:${wa}%"></i></div><span class="l">${l}</span>
      <div class="bar"><i class="${better==='h'?'w':''}" style="width:${wh}%"></i></div><span class="v r ${better==='h'?'w-txt':''}">${hv.toFixed(dec)}</span></div>`;
  }).join('');
  return {html,aw,hw};
}
function dvRows(items){
  return items.map(([l,v])=>{
    const w=Math.min(100,Math.abs(v)/6*100);
    return `<div class="dv"><span class="dl">${l}</span><div class="dvb"><div class="l">${v<0?`<i style="width:${w}%"></i>`:''}</div><div class="r">${v>0?`<i style="width:${w}%"></i>`:''}</div></div>
      <span class="dn" style="color:${v>0.05?'var(--hm)':v<-0.05?'var(--aw)':'var(--mut)'}">${f1(v)}</span></div>`;
  }).join('');
}

function liveLine(ev){
  const a=ev.away,h=ev.home;
  if(ev.state==='in')return `<div class="livebox"><span class="live"><i class="dot"></i>LIVE</span> &nbsp; ${a.abbr} <b>${a.score}</b> – <b>${h.score}</b> ${h.abbr} <span class="sub">· ${ev.detail}</span></div>`;
  if(ev.state==='post')return `<div class="finbox"><span class="final">FINAL</span> &nbsp; ${a.abbr} <b>${a.score}</b> – <b>${h.score}</b> ${h.abbr}</div>`;
  return '';
}

/* ---------- cards ---------- */
function cardHTML(ev){
  const p=getPred(ev),h=ev.home,a=ev.away,snap=TK[ev.id];
  const showSc=ev.state!=='pre';
  const aLead=showSc&&a.score>h.score,hLead=showSc&&h.score>a.score;
  let mid='';
  if(p){
    const pH=Math.round(p.p*100),pA=100-pH,fav=pH>=50?h:a,sp=Math.abs(p.spread);
    const chips=Object.entries(p.F||{}).filter(([k,v])=>Math.abs(v)>=0.4).sort((x,y)=>Math.abs(y[1])-Math.abs(x[1])).slice(0,3)
      .map(([k,v])=>`<span class="fc"><b>${v>0?h.abbr:a.abbr}</b> ${SH[k]||k} ${Math.abs(v).toFixed(1)}</span>`).join('');
    mid=`${pbar(a,h,pA,pH)}
    <div class="pl"><span>${a.abbr} ${pA}%</span><span>${h.abbr} ${pH}%</span></div>
    <div class="tiles">
      <div class="tile g"><small>${ev.state==='pre'?'Pick':'🔒 Pick'}</small><b>${fav.abbr} -${sp.toFixed(1)}</b></div>
      <div class="tile"><small>Score</small><b>${Math.round(p.sA)}–${Math.round(p.sH)}</b></div>
      <div class="tile"><small>Total</small><b>${Math.round(p.tot)}</b></div>
    </div>
    <div class="fcs">${chips||'<span class="fc">Pantay</span>'}</div>`;
  }else mid='<div class="sub" style="margin-top:8px">Walang sapat na data.</div>';
  let mark='';
  if(ev.state==='post'&&p){const ok=(p.p>=.5)===(h.score>a.score);mark=`<span class="rs ${ok?'ok':'no'}">${ok?'✓':'✗'}</span> `}
  const status=ev.state==='post'?`${mark}<span class="final">FINAL</span>`
    :ev.state==='in'?`<span class="live"><i class="dot"></i>${ev.detail}</span>`:'';
  return `<div class="card ${ev.state==='in'?'isLive':''}" onclick="openDetail('${ev.id}')">
    <div class="top"><span>${manilaT(ev.date)}${snap?.recon?' <span class="bd" title="rekonstruksyon">R</span>':''}</span><span>${status}</span></div>
    <div class="teams">
      <div class="tm" onclick="event.stopPropagation();openTeam('${a.id}','${ev.id}')"><span class="side">AWAY</span>${img(a.logo)}<b>${a.abbr}</b><small>${a.record}</small>${showSc?`<div class="sc ${aLead?'lead':''}">${a.score}</div>`:''}</div>
      <div class="at">@</div>
      <div class="tm" onclick="event.stopPropagation();openTeam('${h.id}','${ev.id}')"><span class="side home">HOME</span>${img(h.logo)}<b>${h.abbr}</b><small>${h.record}</small>${showSc?`<div class="sc ${hLead?'lead':''}">${h.score}</div>`:''}</div>
    </div>${mid}</div>`;
}
function renderTabs(){

    const t=new Date(d+'T12:00:00Z').toLocaleDateString('en-PH',{timeZone:'UTC',month:'short',day:'numeric'});

function setStatus(extra){

}
async function loadDayTeams(i){
  const evs=evsOn(DAYS[i]);

  await Promise.all(ids.map(async id=>{PL_DONE[id]=await ensure(id)}));
  return evs;
}
async function selectDay(i){

/* ---------- live refresh ---------- */
const signature=()=>evsOn(DAYS[CUR]).map(e=>e.id+e.state+e.away.score+'-'+e.home.score+e.detail).join('|')
  +'#'+allEvents().filter(e=>e.completed).length+'#'+Object.keys(TK).length+'#'+Object.values(TK).filter(s=>s.locked).length;
async function refreshLive(){
  if(document.hidden||!DAYS.length)return;
  try{
    TICK++;
    const todayET=fmtET(new Date());
    const jobs=[addDays(todayET,-1),todayET,addDays(todayET,1),addDays(todayET,2)].map(loadDay);
    const injTick=TICK%30===0;
    if(injTick)jobs.push(loadInj().then(x=>{if(Object.keys(x).length)INJ=x}));
    await Promise.all(jobs);
    rebuildModel();
    let stale=false;
    for(const id in PL_N)if(M[id]&&M[id].n!==PL_N[id]){stale=true;delete PL[id];delete PL_DONE[id];delete PL_N[id]}
    if(stale)await loadDayTeams(CUR);
    recordAll();
    const sig=signature();
    if(sig!==LASTSIG||stale||injTick){LASTSIG=sig;renderGrid();}
    renderTabs();renderTracker();renderSaved();
    allEvents().forEach(e=>{const el=document.getElementById('lv-'+e.id);if(el)el.innerHTML=liveLine(e)});
    LASTUP=manilaTime(new Date());setStatus();
  }catch(e){}
}

  html+=`<h2>Splits</h2><table class="num"><tr><th></th><th>${a.abbr}</th><th>${h.abbr}</th></tr>
    <tr><td>Home</td><td>${A.hw}-${A.hn-A.hw} (${f1(A.hm)})</td><td>${H.hw}-${H.hn-H.hw} (${f1(H.hm)})</td></tr>
    <tr><td>Road</td><td>${A.rw}-${A.rn-A.rw} (${f1(A.rm)})</td><td>${H.rw}-${H.rn-H.rw} (${f1(H.rm)})</td></tr>
    <tr><td>SOS</td><td>${f1(A.sos)}</td><td>${f1(H.sos)}</td></tr>
    <tr><td>Close (≤5)</td><td>${A.cw}-${A.cl}</td><td>${H.cw}-${H.cl}</td></tr>
    <tr><td>Rotation (≥10 MPG)</td><td>${pA.depth||'—'}</td><td>${pH.depth||'—'}</td></tr></table>`;

  html+=`<h2>Huling 10</h2>
  <div style="margin-bottom:8px"><b class="sub">${a.abbr} ${A.g.slice(-10).filter(x=>x.m>0).length}-${A.g.slice(-10).filter(x=>x.m<=0).length}</b>${chipsRow(A)}</div>
  <div><b class="sub">${h.abbr} ${H.g.slice(-10).filter(x=>x.m>0).length}-${H.g.slice(-10).filter(x=>x.m<=0).length}</b>${chipsRow(H)}</div>`;
  $('#mbody').innerHTML=html;
}

/* ---------- init ---------- */
(async function init(){
  renderTracker();renderSaved();
  setStatus('Loading schedule…');
  try{
    const now=new Date();
    const todayMN=fmtMN(now),todayET=fmtET(now);
    DAYS=[todayMN,addDays(todayMN,1),addDays(todayMN,2)];
    const all=[];for(let d=SEASON_START;d<=addDays(todayET,3);d=addDays(d,1))all.push(d);
    const [prior,inj]=await Promise.all([loadPrior(),loadInj(),Promise.all(all.map(loadDay))]);
    PRIOR=prior;INJ=inj;
    const n=rebuildModel();
    recordAll();
    CUR=0;renderTabs();renderGrid();LASTSIG=signature();renderTracker();renderSaved();
    setStatus(`${n} laro ang ginamit sa ratings`);
    await selectDay(0);
    for(const i of [1,2]){
      if(CUR===i)continue;
      await loadDayTeams(i);recordAll();renderSaved();
    }
    setInterval(refreshLive,REFRESH_MS);
  }catch(err){
    $('#status').innerHTML=`<span style="color:var(--bad)">Hindi makuha ang data: ${err.message}</span>`;
  }
})();
</script>
